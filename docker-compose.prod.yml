services:
  whatsapp-api:
    build: ./whatsapp-api
    container_name: whatsapp_api
    # NOT exposed publicly — internal only
    expose:
      - "3000"
    volumes:
      - whatsapp_data:/app/.wwebjs_auth
    restart: unless-stopped
    networks:
      - internal

  n8n:
    image: n8nio/n8n
    container_name: n8n
    expose:
      - "5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_USER}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_PASSWORD}
      - GENERIC_TIMEZONE=Asia/Kolkata
      - WEBHOOK_URL=http://${SERVER_IP}:5678/
      - N8N_HOST=0.0.0.0
      - N8N_PORT=5678
    volumes:
      - n8n_data:/home/node/.n8n
    restart: unless-stopped
    networks:
      - internal
    depends_on:
      - whatsapp-api

  nginx:
    image: nginx:alpine
    container_name: nginx_proxy
    ports:
      - "5678:5678"   # n8n public
      - "80:80"       # optional HTTP
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    restart: unless-stopped
    networks:
      - internal
    depends_on:
      - n8n

volumes:
  whatsapp_data:
  n8n_data:

networks:
  internal:
    driver: bridge
